<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artikel PT. Fanka Solusi Indonesia">
    <title>Artikel | PT. Fanka Solusi Indonesia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .article-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 40px;
            align-items: start;
        }

        /* ── Article Main ── */
        .article-main { background: #fff; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }

        .article-cover {
            width: 100%; aspect-ratio: 16/6; display: flex;
            align-items: center; justify-content: center;
            font-size: 5rem; color: rgba(255,255,255,0.5);
            position: relative;
        }
        .article-cover-cat {
            position: absolute; top: 20px; left: 24px;
            padding: 5px 14px; border-radius: 50px;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
        }
        .cat-cems-bg   { background: linear-gradient(135deg,#003DA5,#0050cc); }
        .cat-proyek-bg { background: linear-gradient(135deg,#065f46,#059669); }
        .cat-lingk-bg  { background: linear-gradient(135deg,#7c3aed,#5B4FCF); }
        .cat-it-bg     { background: linear-gradient(135deg,#0f4c81,#2778c4); }
        .cat-umum-bg   { background: linear-gradient(135deg,#92400e,#d97706); }

        .cat-cems-badge   { background: rgba(0,61,165,0.12);   color: #003DA5; border: 1px solid rgba(0,61,165,0.2); }
        .cat-proyek-badge { background: rgba(5,150,105,0.1);   color: #065f46; border: 1px solid rgba(5,150,105,0.2); }
        .cat-lingk-badge  { background: rgba(91,79,207,0.1);   color: #5B4FCF; border: 1px solid rgba(91,79,207,0.2); }
        .cat-it-badge     { background: rgba(15,76,129,0.1);   color: #0f4c81; border: 1px solid rgba(15,76,129,0.2); }
        .cat-umum-badge   { background: rgba(217,119,6,0.1);   color: #92400e; border: 1px solid rgba(217,119,6,0.2); }

        .article-head { padding: 36px 40px 24px; }
        .article-cat-badge {
            display: inline-block; padding: 4px 14px; border-radius: 50px;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; margin-bottom: 16px;
        }
        .article-title {
            font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900;
            color: var(--heading); line-height: 1.3; margin-bottom: 20px;
        }
        .article-meta-bar {
            display: flex; align-items: center; gap: 16px;
            padding-bottom: 24px; border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .art-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg,var(--primary),#1a56c4);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 0.75rem; font-weight: 800; flex-shrink: 0;
        }
        .art-meta-info .art-author { font-size: 0.82rem; font-weight: 700; color: var(--heading); }
        .art-meta-info .art-date   { font-size: 0.72rem; color: var(--text-gray); margin-top: 2px; }
        .art-meta-pills { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
        .art-pill {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.72rem; color: var(--text-gray);
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 50px; padding: 4px 12px;
        }

        /* Article content styles */
        .article-content { padding: 28px 40px 40px; }
        .article-content p  { font-size: 0.92rem; color: #374151; line-height: 1.9; margin-bottom: 16px; }
        .article-content h3 { font-size: 1.1rem; font-weight: 800; color: var(--primary); margin: 28px 0 12px; }
        .article-content ul { margin: 0 0 16px 0; padding-left: 20px; }
        .article-content ul li { font-size: 0.9rem; color: #374151; line-height: 1.8; margin-bottom: 6px; }
        .article-content strong { color: var(--heading); }
        .article-content em    { color: var(--text-gray); }
        .article-content table { border-radius: 10px; overflow: hidden; }
        .article-content table th,
        .article-content table td { border: 1px solid var(--border); }

        /* Share & back bar */
        .article-footer-bar {
            padding: 20px 40px; background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
        }
        .share-btns { display: flex; align-items: center; gap: 10px; }
        .share-btn {
            width: 36px; height: 36px; border-radius: 8px; display: flex;
            align-items: center; justify-content: center;
            font-size: 0.85rem; cursor: pointer; border: none;
            transition: all 0.2s; text-decoration: none;
        }
        .share-btn.whatsapp { background: #25d366; color: #fff; }
        .share-btn.twitter  { background: #1da1f2; color: #fff; }
        .share-btn.linkedin { background: #0077b5; color: #fff; }
        .share-btn.copy     { background: var(--border); color: var(--text-gray); }
        .share-btn:hover    { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

        /* ── Sidebar ── */
        .article-sidebar { display: flex; flex-direction: column; gap: 24px; position: sticky; top: 90px; }

        .sidebar-box { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .sidebar-box-head {
            padding: 14px 20px; background: var(--primary);
            font-size: 0.8rem; font-weight: 800; color: #fff; letter-spacing: 0.5px;
        }
        .sidebar-box-body { padding: 16px; }

        .related-card {
            display: flex; gap: 12px; padding: 12px 0;
            border-bottom: 1px solid var(--border); text-decoration: none;
            transition: all 0.2s;
        }
        .related-card:last-child { border-bottom: none; padding-bottom: 0; }
        .related-card:hover { transform: translateX(4px); }
        .related-thumb {
            width: 60px; height: 60px; border-radius: 8px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: rgba(255,255,255,0.7);
        }
        .related-info .r-cat   { font-size: 0.6rem; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; }
        .related-info .r-title { font-size: 0.78rem; font-weight: 700; color: var(--heading); line-height: 1.4; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Tags */
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; }
        .tag-chip  { padding: 5px 12px; border-radius: 50px; background: var(--bg); border: 1px solid var(--border); font-size: 0.72rem; color: var(--text-gray); text-decoration: none; transition: all 0.2s; }
        .tag-chip:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* CTA box */
        .cta-box { background: linear-gradient(135deg,var(--primary),#0050cc); border-radius: 14px; padding: 24px; text-align: center; }
        .cta-box h4 { color: #fff; font-size: 0.92rem; font-weight: 800; margin-bottom: 8px; }
        .cta-box p  { color: rgba(255,255,255,0.7); font-size: 0.76rem; line-height: 1.6; margin-bottom: 16px; }

        /* Not found */
        .not-found-box { text-align: center; padding: 80px 20px; }
        .not-found-box i { font-size: 3rem; color: var(--border); margin-bottom: 16px; display: block; }

        @media(max-width:1024px) { .article-layout { grid-template-columns: 1fr; } .article-sidebar { position: static; } }
        @media(max-width:640px)  { .article-head, .article-content, .article-footer-bar { padding-left: 20px; padding-right: 20px; } }
    </style>
</head>
<body>

    <!-- Page Hero (minimal) -->
    <section class="page-hero" style="padding: 60px 0 40px;" aria-label="Article header">
        <div class="container page-hero-inner">
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <i class="fas fa-chevron-right"></i>
                <a href="news.html">News &amp; Artikel</a>
                <i class="fas fa-chevron-right"></i>
                <span id="breadcrumbTitle">Artikel</span>
            </div>
        </div>
    </section>

    <section class="sec" style="background:var(--bg); padding-top: 0;">
        <div class="container">
            <div class="article-layout" id="articleLayout">
                <!-- Filled by JS -->
            </div>
        </div>
    </section>

    <script src="js/articles.js"></script>
    <script src="js/shared.js"></script>
    <script>
    const CAT_BG = {
        cems: 'cat-cems-bg', proyek: 'cat-proyek-bg',
        lingk: 'cat-lingk-bg', it: 'cat-it-bg', umum: 'cat-umum-bg'
    };
    const CAT_BADGE = {
        cems: 'cat-cems-badge', proyek: 'cat-proyek-badge',
        lingk: 'cat-lingk-badge', it: 'cat-it-badge', umum: 'cat-umum-badge'
    };

    function getParams() {
        return new URLSearchParams(window.location.search);
    }

    function renderRelated(current) {
        const related = ARTICLES
            .filter(a => a.id !== current.id && a.cat === current.cat)
            .slice(0, 3);
        if (!related.length) return '<p style="font-size:0.8rem;color:var(--text-gray);padding:16px;">Tidak ada artikel terkait.</p>';
        return related.map(a => `
            <a href="article.html?id=${a.id}" class="related-card">
                <div class="related-thumb ${CAT_BG[a.cat] || 'cat-umum-bg'}">
                    <i class="fas ${a.icon}"></i>
                </div>
                <div class="related-info">
                    <div class="r-cat">${a.catLabel}</div>
                    <div class="r-title">${a.title}</div>
                </div>
            </a>`).join('');
    }

    function renderArticle() {
        const id = parseInt(getParams().get('id'));
        const layout = document.getElementById('articleLayout');
        const art = ARTICLES.find(a => a.id === id);

        if (!art) {
            layout.innerHTML = `
                <div class="not-found-box" style="grid-column:1/-1">
                    <i class="fas fa-file-times"></i>
                    <h3>Artikel tidak ditemukan</h3>
                    <p style="color:var(--text-gray);margin:12px 0 24px;">Artikel yang Anda cari tidak ada atau telah dihapus.</p>
                    <a href="news.html" class="btn btn-blue"><i class="fas fa-arrow-left"></i> Kembali ke News</a>
                </div>`;
            return;
        }

        // Update page title & breadcrumb
        document.title = art.title + ' | PT. Fanka Solusi Indonesia';
        document.getElementById('breadcrumbTitle').textContent = art.title.length > 50 ? art.title.substring(0,50) + '...' : art.title;

        const shareUrl = encodeURIComponent(window.location.href);
        const shareTitle = encodeURIComponent(art.title);

        const tags = {
            cems: ['CEMS', 'Monitoring Emisi', 'KLHK', 'Engineering', 'Lingkungan'],
            proyek: ['Proyek', 'Update', 'Portfolio', 'Engineering', 'CEMS'],
            lingk: ['Lingkungan', 'Regulasi', 'PROPER', 'AMDAL', 'Emisi'],
            it: ['IT', 'DAS', 'IoT', 'Sistem Monitoring', 'Teknologi'],
            umum: ['Perusahaan', 'Milestone', 'Fanka Solusi', 'Engineering']
        };

        layout.innerHTML = `
            <!-- Main Article -->
            <div class="article-main">
                <div class="article-cover ${CAT_BG[art.cat] || 'cat-umum-bg'}">
                    <i class="fas ${art.icon}" style="position:relative;z-index:1;"></i>
                    <div class="article-cover-cat" style="background:rgba(0,0,0,0.3);color:#fff;border:1px solid rgba(255,255,255,0.2);">
                        ${art.catLabel}
                    </div>
                </div>
                <div class="article-head">
                    <span class="article-cat-badge ${CAT_BADGE[art.cat] || 'cat-umum-badge'}">${art.catLabel}</span>
                    <h1 class="article-title">${art.title}</h1>
                    <div class="article-meta-bar">
                        <div class="art-avatar">${art.avatar}</div>
                        <div class="art-meta-info">
                            <div class="art-author">${art.author}</div>
                            <div class="art-date"><i class="far fa-calendar-alt"></i> ${art.date}</div>
                        </div>
                        <div class="art-meta-pills">
                            <span class="art-pill"><i class="far fa-clock"></i> ${art.readTime}</span>
                            <span class="art-pill"><i class="fas fa-tag"></i> ${art.catLabel}</span>
                        </div>
                    </div>
                </div>
                <div class="article-content">${art.content}</div>
                <div class="article-footer-bar">
                    <a href="news.html" class="btn btn-blue" style="font-size:0.8rem;padding:8px 18px;">
                        <i class="fas fa-arrow-left"></i> Kembali ke News
                    </a>
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span style="font-size:0.75rem;color:var(--text-gray);font-weight:600;">Bagikan:</span>
                        <div class="share-btns">
                            <a href="https://wa.me/?text=${shareTitle}%20${shareUrl}" target="_blank" rel="noopener noreferrer" class="share-btn whatsapp" title="Share via WhatsApp"><i class="fab fa-whatsapp"></i></a>
                            <a href="https://twitter.com/intent/tweet?text=${shareTitle}&url=${shareUrl}" target="_blank" rel="noopener noreferrer" class="share-btn twitter" title="Share di Twitter"><i class="fab fa-twitter"></i></a>
                            <a href="https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}" target="_blank" rel="noopener noreferrer" class="share-btn linkedin" title="Share di LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                            <button class="share-btn copy" title="Salin link" onclick="navigator.clipboard.writeText(window.location.href);this.innerHTML='<i class=\\'fas fa-check\\'></i>';setTimeout(()=>this.innerHTML='<i class=\\'fas fa-link\\'></i>',2000)"><i class="fas fa-link"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <aside class="article-sidebar">
                <!-- Related -->
                <div class="sidebar-box">
                    <div class="sidebar-box-head"><i class="fas fa-newspaper"></i> Artikel Terkait</div>
                    <div class="sidebar-box-body">${renderRelated(art)}</div>
                </div>
                <!-- Tags -->
                <div class="sidebar-box">
                    <div class="sidebar-box-head"><i class="fas fa-tags"></i> Topik</div>
                    <div class="tag-list">
                        ${(tags[art.cat] || tags.umum).map(t => `<a href="news.html" class="tag-chip">${t}</a>`).join('')}
                    </div>
                </div>
                <!-- CTA -->
                <div class="cta-box">
                    <h4>Butuh Solusi Engineering?</h4>
                    <p>Tim ahli kami siap membantu kebutuhan CEMS, monitoring lingkungan, dan engineering industri Anda.</p>
                    <a href="contact.html" class="btn btn-green" style="width:100%;justify-content:center;">
                        <i class="fas fa-envelope"></i> Hubungi Kami
                    </a>
                </div>
                <!-- All articles link -->
                <a href="news.html" style="display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;font-size:0.8rem;font-weight:700;color:var(--primary);text-decoration:none;transition:all 0.2s;" onmouseover="this.style.background='var(--primary)';this.style.color='#fff'" onmouseout="this.style.background='#fff';this.style.color='var(--primary)'">
                    <i class="fas fa-th-list"></i> Lihat Semua Artikel
                </a>
            </aside>`;
    }

    document.addEventListener('DOMContentLoaded', renderArticle);
    </script>
</body>
</html>
